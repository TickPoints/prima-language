[package]
name = "prima-language"
version = "0.3.5"
edition = "2024"
authors = ["TickPoints <tickpoints@outlook.com>"]
repository = "https://github.com/TickPoints/prima-language"
license = "MIT"
description = "Prima - symbol-first scientific computing language toolchain"

[[bin]]
name = "prima"
path = "src/main.rs"

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.5"
edition = "2024"
authors = ["TickPoints <tickpoints@outlook.com>"]
repository = "https://github.com/TickPoints/prima-language"
license = "MIT"

[workspace.dependencies]
unicode-ident = "1.0"
dashmap = "6"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
insta = "1.48"
assert_cmd = "2"
predicates = "3"
proptest = "1"
codespan-reporting = "0.13"
rayon = "1.12"
nalgebra = "0.33"
serde_json = "1"
rustyline = "15"
criterion = "0.8"
cranelift-codegen = "0.135"
cranelift-frontend = "0.135"
cranelift-jit = "0.135"
cranelift-module = "0.135"
target-lexicon = "0.13"
tempfile = "3"

[dependencies]
prima-syntax = { path = "crates/prima-syntax", version = "0.3.5" }
prima-core = { path = "crates/prima-core", version = "0.3.5" }
prima-runtime = { path = "crates/prima-runtime", version = "0.3.5" }
prima-stdlib = { path = "crates/prima-stdlib", version = "0.3.5" }
clap = { workspace = true }
codespan-reporting = { workspace = true }
rustyline = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
proptest = { workspace = true }
num-bigint = { workspace = true }
num-rational = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }
prima-jit = { path = "crates/prima-jit", version = "0.3.5" }

[[bench]]
name = "bench_jit"
harness = false

[[bench]]
name = "bench_suite"
harness = false
