# Build `prima` for every Rust Tier-1 platform on each release and attach the
# binaries and their SHA-256 checksums to the GitHub Release (spec §20 toolchain).
#
# Tier-1 targets (Rust reference): x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu,
# x86_64-pc-windows-msvc, aarch64-pc-windows-msvc, x86_64-apple-darwin, aarch64-apple-darwin.
# Cross-compile helpers: aarch64-linux uses the GNU cross linker; aarch64-windows uses cargo-xwin.

name: release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            apt_deps: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            xwin: true
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux cross linker
        if: matrix.apt_deps
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_deps }}

      - name: Configure cross linker
        if: matrix.linker
        run: echo "${{ matrix.linker_env }}=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Install cargo-xwin (aarch64 Windows)
        if: matrix.xwin
        run: cargo install cargo-xwin --locked

      - name: Add build target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.xwin }}" = "true" ]; then
            cargo xwin build --release --target ${{ matrix.target }} --locked
          else
            cargo build --release --target ${{ matrix.target }} --locked
          fi

      - name: Package binary and checksum
        id: package
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          EXT=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then EXT=".exe"; fi
          ARTIFACT="prima-${TAG}-${{ matrix.target }}${EXT}"
          cp "target/${{ matrix.target }}/release/prima${EXT}" "$ARTIFACT"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
          else
            shasum -a 256 "$ARTIFACT" > "$ARTIFACT.sha256"
          fi
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          cat "$ARTIFACT.sha256"

      - name: Upload binary and checksum to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.package.outputs.artifact }}" \
            "${{ steps.package.outputs.artifact }}.sha256" \
            --clobber
