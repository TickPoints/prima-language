# Release pipeline.
#
# Pushing a tag (e.g. `v0.1.1`) triggers:
#   1. a "release" job that validates the tag against the root package version,
#      extracts the matching section from docs/CHANGELOG.md and creates a
#      GitHub Release with it as the body (falling back to [Unreleased]);
#   2. a "build" job that compiles `prima` for every Rust Tier-1 platform plus
#      selected Tier-2-with-host-tools platforms and attaches the binaries +
#      SHA-256 checksums to that Release.
#
# Tier-1: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-pc-windows-msvc,
# aarch64-pc-windows-msvc, x86_64-apple-darwin, aarch64-apple-darwin.
# Tier 2 (with host tools): x86_64-unknown-linux-musl, aarch64-unknown-linux-musl,
# riscv64gc-unknown-linux-gnu, armv7-unknown-linux-gnueabihf,
# powerpc64le-unknown-linux-gnu, s390x-unknown-linux-gnu.
# Cross-compile helpers: Linux GNU targets use apt cross linkers; x86_64 musl uses the
# host musl toolchain; aarch64 musl uses a musl.cc cross toolchain; aarch64-windows uses cargo-xwin.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]*)"/\1/')"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match root package version ${CARGO_VERSION}"
            exit 1
          fi

      - name: Extract changelog section for this version
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 .github/scripts/release_notes.py "$TAG" > /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file "${{ steps.notes.outputs.notes_file }}"

  build:
    name: ${{ matrix.target }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            apt_deps: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            xwin: true
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin

          # Tier 2 with host tools
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            apt_deps: musl-tools
            linker: musl-gcc
            linker_env: CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            musl_cross: aarch64
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            apt_deps: gcc-riscv64-linux-gnu
            linker: riscv64-linux-gnu-gcc
            linker_env: CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            apt_deps: gcc-arm-linux-gnueabihf
            linker: arm-linux-gnueabihf-gcc
            linker_env: CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER
          - os: ubuntu-latest
            target: powerpc64le-unknown-linux-gnu
            apt_deps: gcc-powerpc64le-linux-gnu
            linker: powerpc64le-linux-gnu-gcc
            linker_env: CARGO_TARGET_POWERPC64LE_UNKNOWN_LINUX_GNU_LINKER
          - os: ubuntu-latest
            target: s390x-unknown-linux-gnu
            apt_deps: gcc-s390x-linux-gnu
            linker: s390x-linux-gnu-gcc
            linker_env: CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_LINKER

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux cross linker
        if: matrix.apt_deps
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_deps }}

      - name: Install musl cross toolchain (aarch64 musl)
        if: matrix.musl_cross == 'aarch64'
        run: |
          curl -sSL https://musl.cc/aarch64-linux-musl-cross.tgz -o /tmp/musl-cross.tgz
          mkdir -p "$HOME/musl-cross"
          tar xzf /tmp/musl-cross.tgz -C "$HOME/musl-cross"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=$HOME/musl-cross/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc" >> "$GITHUB_ENV"

      - name: Configure cross linker
        if: matrix.linker
        run: echo "${{ matrix.linker_env }}=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Install cargo-xwin (aarch64 Windows)
        if: matrix.xwin
        run: cargo install cargo-xwin --locked

      - name: Add build target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.xwin }}" = "true" ]; then
            cargo xwin build --release --target ${{ matrix.target }} --locked
          else
            cargo build --release --target ${{ matrix.target }} --locked
          fi

      - name: Package binary and checksum
        id: package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          EXT=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then EXT=".exe"; fi
          ARTIFACT="prima-${TAG}-${{ matrix.target }}${EXT}"
          cp "target/${{ matrix.target }}/release/prima${EXT}" "$ARTIFACT"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
          else
            shasum -a 256 "$ARTIFACT" > "$ARTIFACT.sha256"
          fi
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          cat "$ARTIFACT.sha256"

      - name: Upload binary and checksum to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "${{ steps.package.outputs.artifact }}" \
            "${{ steps.package.outputs.artifact }}.sha256" \
            --clobber
